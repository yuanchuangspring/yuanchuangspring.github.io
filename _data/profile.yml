short_bio: >-
  <p>
    👋 I am Hanyu Li (李瀚宇), an undergraduate student jointly educated by Beijing University of Posts and Telecommunications and Queen Mary University of London. I expect to receive my Bachelor's degree in Information and Computing Science in 2027. My research interests lie in AI safety, AI agents, and multimodal models, with a particular focus on robustness and safety alignment across text and vision modalities.
  </p>
  <p>
    🎓 I am looking for Ph.D. opportunities for Fall 2027 and am actively seeking collaborations on AI agents. Please feel free to contact me 🚀.
  </p>

